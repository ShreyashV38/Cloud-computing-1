services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db          # service name of the MySQL container (NOT localhost)
      DB_USER: root
      DB_PASSWORD: 4019
      DB_PORT: 3306
      DB_NAME: ecom_db
    depends_on:
      db:
        condition: service_healthy   # wait until MySQL is ready to accept connections

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 4019
      MYSQL_DATABASE: ecom_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql       # persist data across container restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p4019"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
