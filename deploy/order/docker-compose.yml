# Order Service VM
# Run: docker compose up --build -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom_microservices
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-service:
    build:
      context: ../..
      dockerfile: db/Dockerfile
    container_name: order-db-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_microservices?schema=public
      PORT: 4010
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db-init:
    build:
      context: ../..
      dockerfile: db/Dockerfile.init
    container_name: order-db-init
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_microservices?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  order-service:
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      DB_SERVICE_URL: http://db-service:4010
    depends_on:
      db-service:
        condition: service_healthy

volumes:
  order-db-data:
    driver: local
